name: iOS app build

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    name: Beckify iOS ${{ matrix.configuration }} build
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build the app without signing
        run: >-
          xcodebuild -project ios/Beckify.xcodeproj
          -scheme Beckify -configuration ${{ matrix.configuration }}
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath '${{ runner.temp }}/BeckifyDerivedData'
          CODE_SIGNING_ALLOWED=NO build

  navigation-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16.4"
            ios: "18.5"
          - xcode: "26.1.1"
            ios: "26.1"
    name: Beckify swipe-back navigation (iOS ${{ matrix.ios }})
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Test one-page back navigation on iPhone
        run: >-
          xcodebuild -project ios/Beckify.xcodeproj
          -scheme Beckify -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=${{ matrix.ios }}'
          -derivedDataPath '${{ runner.temp }}/BeckifyNavigationDerivedData'
          -resultBundlePath '${{ runner.temp }}/BeckifyNavigation.xcresult'
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO test
      - name: Upload navigation test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beckify-navigation-results-ios-${{ matrix.ios }}
          path: ${{ runner.temp }}/BeckifyNavigation.xcresult
