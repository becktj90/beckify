name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @workspace/beckify run typecheck

      - name: Lint
        run: pnpm --filter @workspace/beckify run lint

      - name: Test
        run: pnpm --filter @workspace/beckify run test

      - name: Build beckify
        run: pnpm --filter @workspace/beckify run build
        env:
          BASE_PATH: /
          PORT: "3000"
          VITE_AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}

      - name: Verify crawl files before publish
        run: |
          test -s artifacts/beckify/dist/public/sitemap.xml
          test -s artifacts/beckify/dist/public/robots.txt
          head -n 1 artifacts/beckify/dist/public/sitemap.xml | grep -q 'xml version'
          grep -q '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' artifacts/beckify/dist/public/sitemap.xml
          grep -q 'Sitemap: https://beckify.com/sitemap.xml' artifacts/beckify/dist/public/robots.txt
          if grep -qi '<html' artifacts/beckify/dist/public/sitemap.xml; then
            echo "sitemap.xml must be XML, not an HTML fallback"
            exit 1
          fi

      - name: Configure TDR API endpoint
        run: node -e 'const fs=require("fs"); const endpoint=(process.env.TDR_API_BASE_URL||"").replace(/\/$/,"").replace(/&/g,"&amp;").replace(/"/g,"&quot;"); const files=["artifacts/beckify/dist/public/toolbox/index.html","artifacts/beckify/dist/public/toolbox/panel-schedule.html","artifacts/beckify/dist/public/toolbox/panel-power-study.html"]; for (const p of files) { if (!fs.existsSync(p)) continue; fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("<meta name=\"beckify-api-base-url\" content=\"\">",`<meta name="beckify-api-base-url" content="${endpoint}">`)); }'
        env:
          TDR_API_BASE_URL: ${{ vars.TDR_API_BASE_URL }}

      - name: Add CNAME and SPA fallback
        run: |
          echo "beckify.com" > artifacts/beckify/dist/public/CNAME
          cp artifacts/beckify/dist/public/index.html artifacts/beckify/dist/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/beckify/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
