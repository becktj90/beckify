# iOS math (Linux)

# Runs the pure-Swift BeckifyMath package on Ubuntu.
# This is not an iOS Simulator, Xcode, or SwiftUI UI build.
# App and Xcode project changes run the same suite so a compile-only
# Beckify fix still gets a green swift test check.

name: iOS math (Linux)

on:
  pull_request:
    paths:
      - "ios/BeckifyMath/**"
      - "ios/Beckify/**"
      - "ios/Beckify.xcodeproj/**"
      - ".github/workflows/ios-math.yml"
  push:
    branches:
      - main
    paths:
      - "ios/BeckifyMath/**"
      - "ios/Beckify/**"
      - "ios/Beckify.xcodeproj/**"
      - ".github/workflows/ios-math.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    name: swift test (Ubuntu, BeckifyMath only)
    runs-on: ubuntu-latest
    container: swift:6.1.2
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run BeckifyMath tests
        run: cd ios/BeckifyMath && swift test
