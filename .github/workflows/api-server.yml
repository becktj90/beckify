# API server (Express vision routes)

# Typecheck + dry-POST smoke. This is not a Vercel production deploy.

name: API server

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - ".github/workflows/api-server.yml"
  push:
    branches:
      - main
    paths:
      - "artifacts/api-server/**"
      - ".github/workflows/api-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: typecheck + vision route smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck

      - name: API contract tests
        run: pnpm --filter @workspace/api-server run test

      - name: Smoke vision routes
        run: pnpm --filter @workspace/api-server run smoke

  voice-engine:
    name: free voice engine (Kokoro) unit + synth smoke + image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python 3.11 (matches the Debian bookworm runtime image)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install engine requirements
        working-directory: artifacts/api-server/voice-engine
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        working-directory: artifacts/api-server/voice-engine
        run: python -m unittest -v test_server

      - name: Fetch pinned models and synthesize one line
        working-directory: artifacts/api-server/voice-engine
        run: |
          sh ./fetch-models.sh ./models
          VOICE_ENGINE_PORT=8090 python server.py &
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8090/healthz && break; sleep 2; done
          curl -fsS -o /tmp/line.mp3 -H 'Content-Type: application/json' \
            -d '{"text":"Kill the power before you open the panel.","lang":"en-us","voices":[["am_puck",0.6],["am_fenrir",0.4]],"speed":0.88,"pitch_semitones":-0.7,"format":"mp3"}' \
            http://127.0.0.1:8090/synthesize
          test "$(stat -c %s /tmp/line.mp3)" -gt 10000
          curl -fsS -o /tmp/line.wav -H 'Content-Type: application/json' \
            -d '{"text":"Quítale la corriente antes de abrir el panel.","lang":"es","voices":[["em_santa",0.6],["em_alex",0.4]],"speed":0.9,"pitch_semitones":-2.2,"format":"wav"}' \
            http://127.0.0.1:8090/synthesize
          test "$(stat -c %s /tmp/line.wav)" -gt 50000

      - name: Default image matches the pre-engine image (no Python, no model, same size)
        run: |
          docker build -t beckify-api-default artifacts/api-server
          git show 10b638c:artifacts/api-server/Dockerfile > /tmp/Dockerfile.pre-engine
          docker build -t beckify-api-pre-engine -f /tmp/Dockerfile.pre-engine artifacts/api-server
          ! docker run --rm --entrypoint sh beckify-api-default -c 'command -v python3 || test -e /opt/voice || test -e /app/voice-engine'
          docker image ls --format '{{.Repository}} {{.Size}}' | grep -E 'beckify-api-(default|pre-engine)'
          a=$(docker image inspect -f '{{.Size}}' beckify-api-default); b=$(docker image inspect -f '{{.Size}}' beckify-api-pre-engine)
          echo "default=$a pre-engine=$b"
          test $(( a > b ? a - b : b - a )) -lt 1048576

      - name: Build the optional voice-engine image (not pushed, not deployed)
        run: docker build --target voice-runtime -t beckify-api-ci artifacts/api-server

      - name: Opt-in container end to end (Crew Talk speak on the free engine)
        run: |
          docker run -d --name api -e VOICE_ENGINE_LOCAL=1 -e CREW_VOICE_PROVIDER=kokoro -p 8080:8080 beckify-api-ci
          for i in $(seq 90); do curl -fsS http://127.0.0.1:8080/api/healthz >/dev/null && break; sleep 2; done
          # The engine loads after the API; retry until it answers.
          for i in $(seq 60); do
            code=$(curl -s -o /tmp/bodie.mp3 -D /tmp/h.txt -w '%{http_code}' -H 'Content-Type: application/json' \
              -d '{"text":"Kill the power first.","voice":"XVO6RhOYU9ZEKHFXrx6b","model":"eleven_v3","language":"en","format":"mp3"}' \
              http://127.0.0.1:8080/api/speak)
            [ "$code" = "200" ] && break; sleep 3
          done
          docker logs api 2>&1 | tail -20
          test "$code" = "200"
          grep -i '^x-beckify-tts-provider: kokoro' /tmp/h.txt
          test "$(stat -c %s /tmp/bodie.mp3)" -gt 5000
