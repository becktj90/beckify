<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kestrel Heavy</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05050d; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: ui-monospace, Menlo, monospace; }
    /* The player fills the viewport. No portrait letterbox and no frame around the canvas. */
    #stage { position: fixed; inset: 0; width: 100vw; width: 100dvw; height: 100vh; height: 100dvh;
      background: #05050d; border: 0; border-radius: 0; box-shadow: none; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #05050d; outline: none; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #e8e4ff; text-align: center; background: #05050d; z-index: 2; padding: 24px; box-sizing: border-box; }
    #overlay h1 { font-size: 22px; letter-spacing: 3px; margin: 0 0 20px; }
    #bar { width: min(280px, 60%); height: 6px; background: #1b1b3a; border-radius: 3px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #b7abff; }
    #msg { margin-top: 14px; font-size: 13px; opacity: .8; }
    #start { display: none; margin-top: 22px; min-height: 48px; min-width: 160px; padding: 0 28px; font: inherit; font-size: 16px; font-weight: 700;
      letter-spacing: 2px; color: #05050d; background: #b7abff; border: 0; border-radius: 8px; }
    /* Same corner the game reserves (88 by 44, 8px inside the safe area). */
    #fs { display: none; position: fixed; z-index: 6; box-sizing: border-box;
      top: max(8px, env(safe-area-inset-top, 0px));
      right: max(8px, env(safe-area-inset-right, 0px));
      width: 88px; height: 44px; padding: 0; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 1px;
      color: #f4ead2; background: rgba(10, 15, 36, 0.92); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="overlay">
      <h1>KESTREL HEAVY</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="msg">Loading…</div>
      <button id="start" type="button">TAP TO PLAY</button>
    </div>
  </div>
  <button id="fs" type="button" aria-pressed="false" aria-label="Play fullscreen">FULL</button>
  <script>
    // Everything here is same-origin. Brotli/gzip files are inflated by the loader (decompressionFallback)
    // so this works on hosts that cannot send a Content-Encoding header (GitHub Pages).
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/66468fce6c68d9ad0b6181f4aa8b73b3.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/63f5cf97fbb28f710ed5f36095cd4b3a.data.unityweb",
      frameworkUrl: buildUrl + "/98cbe74ad5c9951ec80d565e922c4a63.framework.js.unityweb",
      codeUrl: buildUrl + "/98c5342287a2b3cb912ad79f61d45c68.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Beckify",
      productName: "Kestrel Heavy",
      productVersion: "2.0.0",
      autoSyncPersistentDataPath: true, // saves flush to IndexedDB on file change
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    var canvas = document.querySelector("#unity-canvas");
    var stage = document.querySelector("#stage");
    var fill = document.querySelector("#fill"), msg = document.querySelector("#msg"),
        overlay = document.querySelector("#overlay"), start = document.querySelector("#start"),
        fs = document.querySelector("#fs");
    var SOURCE = "beckify-kestrel-viewport";

    function parentPost(payload) {
      if (!window.parent || window.parent === window) return;
      try { window.parent.postMessage(payload, "*"); } catch (err) {}
    }
    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    var showingExit = false;
    function setFsLabel(exit) {
      showingExit = !!exit;
      fs.textContent = exit ? "EXIT" : "FULL";
      fs.setAttribute("aria-pressed", exit ? "true" : "false");
      fs.setAttribute("aria-label", exit ? "Exit fullscreen" : "Play fullscreen");
    }
    function requestNative() {
      var root = document.documentElement;
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!req) return;
      try { req.call(root); } catch (err) {}
    }
    function exitNative() {
      if (!isFullscreen()) return;
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!exit) return;
      try { exit.call(document); } catch (err) {}
    }
    function embedded() {
      try { return window.parent && window.parent !== window; } catch (err) { return false; }
    }
    function enterImmersive() {
      // Inside beckify the host owns fullscreen: native on desktop, CSS immersive on iOS.
      // A second requestFullscreen from the iframe fights that. Standalone preview uses the API here.
      if (embedded()) parentPost({ source: SOURCE, type: "fullscreen", enter: true });
      else requestNative();
    }
    function leaveImmersive() {
      if (embedded()) parentPost({ source: SOURCE, type: "fullscreen", enter: false });
      else exitNative();
      setFsLabel(false);
    }
    function fit(width, height) {
      if (width > 0 && height > 0) {
        stage.style.width = Math.round(width) + "px";
        stage.style.height = Math.round(height) + "px";
      } else {
        stage.style.width = "100dvw";
        stage.style.height = "100dvh";
      }
    }
    function onResize() {
      fit(0, 0);
      parentPost({ source: SOURCE, type: "request" });
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", onResize);
      window.visualViewport.addEventListener("scroll", onResize);
    }
    document.addEventListener("fullscreenchange", function () { setFsLabel(isFullscreen()); });
    document.addEventListener("webkitfullscreenchange", function () { setFsLabel(isFullscreen()); });
    window.addEventListener("message", function (event) {
      if (event.source !== window.parent) return;
      var data = event.data;
      if (!data || data.source !== SOURCE) return;
      if (data.type === "viewport") {
        if (data.width > 0 && data.height > 0) fit(data.width, data.height);
        if (typeof data.immersive === "boolean") setFsLabel(data.immersive || isFullscreen());
      }
    });
    fs.onclick = function () {
      // Hosted on beckify, fullscreen lives on the parent, so the iframe's
      // fullscreenElement stays null. The label is the source of truth.
      if (showingExit || isFullscreen()) leaveImmersive();
      else enterImmersive();
    };
    parentPost({ source: SOURCE, type: "chrome" });
    parentPost({ source: SOURCE, type: "request" });

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { fill.style.width = (p * 100) + "%"; })
        .then(function (unity) {
          window.kestrelUnity = unity;
          // Browsers block audio until a user gesture. This tap is that gesture, and it also enters fullscreen.
          msg.textContent = "Ready";
          start.style.display = "inline-block";
          start.onclick = function () {
            overlay.style.display = "none";
            fs.style.display = "block";
            enterImmersive();
            canvas.focus();
          };
        })
        .catch(function (err) { msg.textContent = "Could not start: " + err; });
    };
    document.body.appendChild(script);
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  </script>
</body>
</html>
