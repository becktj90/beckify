<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kestrel Heavy</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05050d; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: ui-monospace, Menlo, monospace; }
    /* The game is portrait-only (phone 9:19.5, iPad 3:4); its UI is laid out for those shapes, so we never stretch it.
       Phones/portrait windows: fill the screen (max 9:19.5 tall column).
       Landscape windows (desktop monitors): a 3:4 iPad-shaped stage at full viewport height, centred, with themed side panels. */
    #stage { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;
      height: 100vh; height: 100dvh; width: calc(100vh * 9 / 19.5); width: calc(100dvh * 9 / 19.5); max-width: 100vw; }
    @media (max-aspect-ratio: 9/19.5) { #stage { width: 100vw; height: calc(100vw * 19.5 / 9); max-height: 100dvh; } }
    @media (min-aspect-ratio: 1/1) {
      #stage { width: calc(100vh * 3 / 4); width: calc(100dvh * 3 / 4); max-width: 100vw;
        box-shadow: 0 0 0 1px #2a2a55, 0 0 60px 6px rgba(120, 100, 255, .18); }
    }
    /* Side panels: only exist on landscape windows wide enough to leave room beside the 3:4 stage. */
    .side { display: none; }
    @media (min-aspect-ratio: 1/1) {
      body { background: radial-gradient(ellipse at 50% 40%, #11112a 0%, #07070f 70%, #05050d 100%); }
      body::before { content: ""; position: fixed; inset: 0; z-index: 0; opacity: .5;
        background-image: linear-gradient(rgba(183,171,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(183,171,255,.05) 1px, transparent 1px);
        background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse at center, transparent 30%, #000 85%); mask-image: radial-gradient(ellipse at center, transparent 30%, #000 85%); }
      .side { display: flex; position: fixed; top: 0; bottom: 0; z-index: 0; flex-direction: column; justify-content: center;
        width: calc((100vw - 100dvh * 3 / 4) / 2); padding: 0 clamp(16px, 3vw, 56px); box-sizing: border-box; color: #8f8ab8; font-size: clamp(11px, 1vw, 15px); line-height: 1.7; letter-spacing: 1px; }
      .side.l { left: 0; align-items: flex-end; text-align: right; }
      .side.r { right: 0; align-items: flex-start; text-align: left; }
      .side h2 { margin: 0 0 12px; font-size: clamp(14px, 1.5vw, 24px); letter-spacing: 4px; color: #e8e4ff; }
      .side b { color: #b7abff; font-weight: 700; }
      .side p { margin: 0 0 6px; }
    }
    @media (min-aspect-ratio: 1/1) and (max-aspect-ratio: 1280/1000) { .side { display: none; } }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #05050d; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #e8e4ff; text-align: center; background: #05050d; z-index: 2; padding: 24px; box-sizing: border-box; }
    #overlay h1 { font-size: 22px; letter-spacing: 3px; margin: 0 0 20px; }
    #bar { width: 60%; height: 6px; background: #1b1b3a; border-radius: 3px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #b7abff; }
    #msg { margin-top: 14px; font-size: 13px; opacity: .8; }
    #start { display: none; margin-top: 22px; min-height: 48px; padding: 0 28px; font: inherit; font-size: 16px; font-weight: 700;
      letter-spacing: 2px; color: #05050d; background: #b7abff; border: 0; border-radius: 8px; }
  </style>
</head>
<body>
  <aside class="side l" aria-hidden="true"><h2>KESTREL HEAVY</h2><p>Design the rocket.</p><p>Launch it.</p><p>Watch every stage.</p></aside>
  <aside class="side r" aria-hidden="true"><h2>CONTROLS</h2><p><b>Click / tap</b> &mdash; menus and buttons</p><p><b>Esc</b> &mdash; leave fullscreen</p><p><b>FULL</b> &mdash; fullscreen (top right)</p></aside>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="overlay">
      <h1>KESTREL HEAVY</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="msg">Loading…</div>
      <button id="start" type="button">TAP TO PLAY</button>
    </div>
  </div>
  <script>
    // Everything here is same-origin. Brotli/gzip files are inflated by the loader (decompressionFallback)
    // so this works on hosts that cannot send a Content-Encoding header (GitHub Pages).
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/8b680b0f4c390c7435cca269845abd63.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/c677555e294d3f877c6a74cea6751bd8.data.unityweb",
      frameworkUrl: buildUrl + "/95eea05a0db01f77587248ce26b1ce52.framework.js.unityweb",
      codeUrl: buildUrl + "/6c9d9ca3d625b8c957560545fa495621.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Beckify",
      productName: "Kestrel Heavy",
      productVersion: "2.0.0",
      autoSyncPersistentDataPath: true, // saves flush to IndexedDB on file change
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#fill"), msg = document.querySelector("#msg"),
        overlay = document.querySelector("#overlay"), start = document.querySelector("#start");
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { fill.style.width = (p * 100) + "%"; })
        .then(function (unity) {
          window.kestrelUnity = unity;
          // Browsers block audio until a user gesture: the first tap (this button) is the gesture that lets Unity resume its AudioContext.
          msg.textContent = "Ready";
          start.style.display = "inline-block";
          start.onclick = function () {
            overlay.style.display = "none";
            canvas.focus();
          };
        })
        .catch(function (err) { msg.textContent = "Could not start: " + err; });
    };
    document.body.appendChild(script);
    // Portrait-only: the stage is always portrait. Block pinch/scroll gestures that would move the page.
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  </script>
</body>
</html>
