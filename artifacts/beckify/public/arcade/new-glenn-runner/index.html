<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Glenn Runner</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --violet: #b7abff;
      --fg: #eef0fa;
      --fg-muted: #9aa3c7;
      --font-main: "Exo 2", "Sora", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 20% 0%, #1b1638, #05060f 55%);
      color: var(--fg);
      font-family: var(--font-main);
    }
    body { padding: 10px 10px 16px; }
    .cabinet {
      max-width: 460px;
      margin: 0 auto;
    }
    #arcade-fs-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 1.15rem;
      border: 1px solid rgba(183, 171, 255, 0.45);
      background: #05050d;
      box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.06);
    }
    #arcadeCanvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      cursor: pointer;
      background: #05050d;
    }
    .hud-btns {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }
    .hud-btns button {
      min-width: 44px;
      min-height: 36px;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(183,171,255,.7);
      background: rgba(8,8,24,.82);
      color: var(--violet);
      font: 700 0.72rem/1 var(--font-main);
      cursor: pointer;
      touch-action: manipulation;
    }
    #arcade-touch-btns {
      display: flex;
      gap: 8px;
      margin: 10px auto 0;
      max-width: 420px;
      user-select: none;
    }
    #arcade-touch-btns button {
      flex: 1;
      min-height: 52px;
      border-radius: 0.85rem;
      border: 1px solid rgba(183,171,255,.65);
      background: rgba(16,12,40,.9);
      color: var(--violet);
      font: 800 0.82rem/1 var(--font-main);
      cursor: pointer;
      touch-action: none;
    }
    #atb-boost { flex: 2; border-width: 2px; }
    .help {
      margin: 10px 2px 0;
      color: var(--fg-muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }
    .record {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 0.9rem;
      border: 1px solid rgba(183,171,255,.28);
      background: rgba(12,10,28,.72);
    }
    .record-title { font-size: 0.7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--violet); font-family: var(--font-mono); }
    #arcade-hi-score { margin-top: 6px; font-size: 1.25rem; color: var(--violet); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .btn {
      margin-top: 8px;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(183,171,255,.45);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }
    html.arcade-immersive-open, html.arcade-immersive-open body { overflow: hidden; }
    #arcade-fs-wrapper.arcade-immersive {
      position: fixed !important;
      inset: 0;
      z-index: 10000;
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: auto !important;
      padding: 12px;
      background: #05050d;
      border-radius: 0;
    }
    #arcade-fs-wrapper.arcade-immersive #arcadeCanvas {
      max-width: 100%;
      max-height: calc(100dvh - 24px);
      margin: auto;
    }
  </style>
</head>
<body data-arcade-standalone="true">
  <section id="sec-arcade" class="cabinet">
    <div id="arcade-fs-wrapper">
      <canvas id="arcadeCanvas" width="420" height="640"></canvas>
      <div class="hud-btns">
        <button id="arcade-mute-btn" onclick="arcadeToggleMute()" title="Toggle mute" aria-label="Toggle mute">🔊</button>
        <button id="arcade-pause-btn" onclick="arcadeTogglePause()" title="Pause mission" aria-label="Pause mission">⏸</button>
        <button onclick="arcadeToggleSettings()" title="Mission settings" aria-label="Mission settings">⚙</button>
        <button id="arcade-fullscreen-btn" onclick="arcadeFullscreen()" title="Play fullscreen" aria-label="Play fullscreen">⛶</button>
      </div>
    </div>
    <div id="arcade-touch-btns">
      <button id="atb-left" aria-label="Steer left">◀</button>
      <button id="atb-boost" aria-label="Hold boost to climb">HOLD TO CLIMB</button>
      <button id="atb-right" aria-label="Steer right">▶</button>
    </div>
    <p class="help">Hold BOOST during countdown, steer around hazards, tap the highlighted mission prompt. Start-screen difficulty stays KID / CADET / PAD RAT.</p>
    <div class="record">
      <div class="record-title">Mission record</div>
      <div id="arcade-hi-score">NO MISSIONS FLOWN</div>
      <button class="btn" onclick="arcadeReset()">Reset mission record</button>
    </div>
  </section>
  <script>
    window.recordGameScore = window.recordGameScore || function () { return Promise.resolve(null); };
  </script>
  <script src="/toolbox/js/arcade.js"></script>
</body>
</html>
