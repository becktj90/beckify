<title>LC-9 3/4 Power Distribution</title>
<style>
:root{--void:#06080b;--rail:#1b2733;--rail2:#26364a;--ink:#e7eff6;--muted:#6e8091;--dim:#4b5b6b;--alarm:#ff4a5e;--plume:#2fd6c3;--mono:"JetBrains Mono",ui-monospace,monospace;--cond:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(60vw 40vh at 15% -10%,#0e1a24,transparent 60%),var(--void);color:var(--ink);font-family:var(--cond);display:flex;align-items:center;justify-content:center;padding:20px}
.g{width:min(420px,100%);background:linear-gradient(180deg,#0d1218,#0a1016);border:1px solid var(--rail);border-radius:3px;padding:26px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.s{width:38px;height:38px;border:1px solid var(--plume);border-radius:2px;position:relative;background:#081314;margin-bottom:16px}
.s::before{content:"";position:absolute;inset:7px 16px;background:var(--plume);opacity:.85}
.s::after{content:"";position:absolute;left:7px;right:7px;top:17px;height:1px;background:var(--plume);opacity:.6}
h1{font-size:19px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 3px;font-weight:700}
.t{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:22px}
label{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;background:#0b1117;border:1px solid var(--rail2);color:var(--ink);padding:11px 12px;border-radius:2px;font-family:var(--mono);font-size:14px}
input:focus{outline:2px solid var(--plume);outline-offset:1px}
button{width:100%;margin-top:14px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;background:rgba(47,214,195,.12);border:1px solid var(--plume);color:var(--ink);padding:12px;border-radius:2px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.m{font-family:var(--mono);font-size:11.5px;margin-top:13px;min-height:16px;color:var(--muted)}
.m.err{color:var(--alarm)}
.f{font-size:10.5px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase;margin-top:20px;padding-top:14px;border-top:1px solid var(--rail)}
</style>
</head>
