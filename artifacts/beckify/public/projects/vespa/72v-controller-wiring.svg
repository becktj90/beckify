<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" width="1800" height="1120" role="img" aria-labelledby="title desc">
  <title id="title">Vespa EV Conversion - 72V Controller Wiring</title>
  <desc id="desc">Educational build diagram of the 72V 20Ah 20S10P pack, Daly BMS 20S 200A, pre-charge and C1 contactor, DC-DC converter, 12V fuse block, 4kW BLDC motor, Hall sensors, throttle, and programming link. Redrawn from controller-wiring-reference.</desc>
  <defs>
    <marker id="arr-hv" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e67e22"/></marker>
    <marker id="arr-12" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c0392b"/></marker>
    <style>
      .paper { fill: #ffffff; }
      .ink { fill: #1d2421; }
      .muted { fill: #5a635c; }
      .label { font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; }
      .w-hv { stroke: #e67e22; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .w-neg { stroke: #1a1a1a; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .w-12 { stroke: #c0392b; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .w-u { stroke: #2563eb; stroke-width: 2.8; fill: none; }
      .w-v { stroke: #16a34a; stroke-width: 2.8; fill: none; }
      .w-w { stroke: #ca8a04; stroke-width: 2.8; fill: none; }
      .w-ctl { stroke: #9ca3af; stroke-width: 2.2; fill: none; }
      .w-ct { stroke: #06b6d4; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; }
      .w-hall { stroke: #7c3aed; stroke-width: 2.2; fill: none; }
      .w-thr { stroke: #16a34a; stroke-width: 2.2; fill: none; stroke-dasharray: 8 5; }
      .w-prg { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 3 5; }
    </style>
  </defs>

  <rect class="paper" width="1800" height="1120"/>

  <!-- ===================== WIRES (behind components) ===================== -->

  <!-- Pack + bus to the pre-charge tap; 12V accessory bus is separate -->
  <path class="w-hv" d="M214 92 H 400"/>
  <path class="w-12" d="M520 92 H 1188"/>

  <!-- Pack + down into Daly BMS P+ and onward to C1 -->
  <path class="w-hv" d="M214 92 V 198"/>
  <path class="w-hv" d="M250 248 V 400 H 202"/>
  <path class="w-hv" d="M202 400 H 430"/>
  <path class="w-hv" d="M494 400 H 720"/>

  <!-- Pack - down the left rail to motor and controller B- -->
  <path class="w-neg" d="M90 92 V 560 H 720"/>

  <!-- Pre-charge: HV in from pack+ bus, control from C1, 12V out -->
  <path class="w-hv" d="M400 92 V 118"/>
  <path class="w-ctl" d="M138 400 V 176 H 374"/>
  <path class="w-12" d="M426 148 H 520 V 92"/>

  <!-- DC-DC HV tap from B+ run, 12V up to bus, sense to meter -->
  <path class="w-hv" d="M462 400 V 268"/>
  <path class="w-12" d="M462 220 V 92"/>
  <path class="w-ct" d="M494 244 H 640 V 200"/>

  <!-- Ignition to fuse block -->
  <path class="w-12" d="M1228 92 H 1488"/>

  <!-- Motor phases -->
  <path class="w-u" d="M174 548 H 300 V 448 H 720"/>
  <path class="w-v" d="M174 580 H 320 V 480 H 720"/>
  <path class="w-w" d="M174 612 H 340 V 512 H 720"/>

  <!-- Hall -->
  <path class="w-hall" d="M120 634 V 820 H 950 V 680"/>

  <!-- Lock (controller bottom) -->
  <path class="w-hv" d="M896 680 V 760 H 138 V 432"/>

  <!-- Throttle -->
  <path class="w-thr" d="M930 680 V 820 H 1420"/>

  <!-- Programming -->
  <path class="w-prg" d="M198 975 H 930 V 680"/>

  <!-- ===================== COMPONENTS ===================== -->

  <!-- Battery pack -->
  <g class="label" transform="translate(70,54)">
    <line x1="20" y1="38" x2="44" y2="38" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="44" y="22" width="18" height="32" rx="1" fill="#1a1a1a"/>
    <rect x="66" y="14" width="18" height="48" rx="1" fill="#1a1a1a"/>
    <line x1="84" y1="38" x2="100" y2="38" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="20" cy="38" r="4.5" fill="#1a1a1a"/>
    <circle cx="144" cy="38" r="5.5" fill="#e67e22" stroke="#c45f10" stroke-width="1"/>
    <text x="149" y="14" font-size="12" font-weight="700" fill="#e67e22">+</text>
    <text x="12" y="14" font-size="12" font-weight="700" class="ink">-</text>
    <text x="82" y="86" text-anchor="middle" font-size="14" font-weight="700" class="ink">72V 20Ah 20S10P Pack</text>
  </g>

  <!-- Daly BMS -->
  <g class="label" transform="translate(90,198)">
    <rect x="0" y="0" width="160" height="100" rx="12" fill="#f4f5f7" stroke="#1d2421" stroke-width="1.6"/>
    <circle cx="80" cy="28" r="10" fill="#2b2f36"/>
    <rect x="70" y="22" width="20" height="12" rx="2" fill="#8d939c"/>
    <text x="80" y="58" text-anchor="middle" font-size="14" font-weight="700" class="ink">Daly BMS</text>
    <text x="80" y="76" text-anchor="middle" font-size="12" class="muted">20S 200A</text>
    <text x="148" y="92" text-anchor="end" font-size="11" font-weight="700" fill="#e67e22">P+</text>
  </g>

  <!-- C1 main contactor -->
  <g class="label" transform="translate(170,400)">
    <circle r="32" fill="#fff" stroke="#1d2421" stroke-width="1.8"/>
    <text y="6" text-anchor="middle" font-size="16" font-weight="700" class="ink">C1</text>
    <text y="58" text-anchor="middle" font-size="12" class="muted">Main contactor</text>
  </g>

  <!-- Pre-charge module -->
  <g class="label" transform="translate(400,148)">
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#fff" stroke="#1d2421" stroke-width="1.8"/>
    <text y="68" text-anchor="middle" font-size="13" font-weight="700" class="ink">Pre-Charge</text>
    <text y="86" text-anchor="middle" font-size="12" class="muted">Module</text>
  </g>

  <!-- DC-DC -->
  <g class="label" transform="translate(430,220)">
    <rect x="0" y="0" width="64" height="48" rx="4" fill="#fff" stroke="#1d2421" stroke-width="1.8"/>
    <text x="32" y="22" text-anchor="middle" font-size="13" font-weight="700" class="ink">DC-DC</text>
    <text x="32" y="38" text-anchor="middle" font-size="10" class="muted">72V -> 12V</text>
    <text x="32" y="68" text-anchor="middle" font-size="12" class="muted">12V DC</text>
    <!-- ground -->
    <line x1="32" y1="48" x2="32" y2="80" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="18" y1="80" x2="46" y2="80" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="22" y1="86" x2="42" y2="86" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="26" y1="92" x2="38" y2="92" stroke="#1a1a1a" stroke-width="2"/>
  </g>

  <!-- CT -->
  <g class="label" transform="translate(462,400)">
    <rect x="-32" y="-18" width="64" height="36" rx="6" fill="#fff" stroke="#1d2421" stroke-width="1.6"/>
    <text y="5" text-anchor="middle" font-size="14" font-weight="700" class="ink">CT</text>
    <text y="40" text-anchor="middle" font-size="11" class="muted">Current sensor</text>
  </g>

  <!-- Ignition -->
  <g class="label" transform="translate(1188,92)">
    <circle r="7" fill="#fff" stroke="#1d2421" stroke-width="1.8"/>
    <circle cx="40" r="7" fill="#fff" stroke="#1d2421" stroke-width="1.8"/>
    <line x1="7" y1="-10" x2="36" y2="-4" stroke="#1d2421" stroke-width="2.2"/>
    <text x="20" y="-22" text-anchor="middle" font-size="12" font-weight="700" class="ink">Ignition</text>
  </g>

  <!-- Power meter -->
  <g class="label" transform="translate(640,200)">
    <rect width="150" height="56" rx="6" fill="#0b0d10" stroke="#1d2421" stroke-width="1.4"/>
    <text x="16" y="24" fill="#7dffa3" font-size="20" font-family="ui-monospace, Liberation Mono, DejaVu Sans Mono, monospace" font-weight="700">74.0V</text>
    <text x="16" y="44" fill="#9aa09a" font-size="11">Power meter</text>
  </g>

  <!-- 12V fuse block -->
  <g class="label" transform="translate(1488,40)">
    <rect width="244" height="148" rx="10" fill="#f4efe3" stroke="#c8c2b4" stroke-width="1.6"/>
    <text x="16" y="24" font-size="13" font-weight="700" class="ink">12V Fuse block</text>
    <g fill="#fff" stroke="#d7d1c4" stroke-width="1">
      <rect x="18" y="40" width="208" height="14" rx="2"/>
      <rect x="18" y="60" width="208" height="14" rx="2"/>
      <rect x="18" y="80" width="208" height="14" rx="2"/>
      <rect x="18" y="100" width="208" height="14" rx="2"/>
      <rect x="18" y="120" width="208" height="14" rx="2"/>
    </g>
    <!-- ground under block -->
    <line x1="122" y1="148" x2="122" y2="180" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="108" y1="180" x2="136" y2="180" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="112" y1="186" x2="132" y2="186" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="116" y1="192" x2="128" y2="192" stroke="#1a1a1a" stroke-width="2"/>
  </g>

  <!-- Motor -->
  <g class="label" transform="translate(120,580)">
    <circle r="54" fill="#fff" stroke="#1d2421" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-size="32" font-weight="700" class="ink">M</text>
    <text y="84" text-anchor="middle" font-size="13" font-weight="700" class="ink">4kW BLDC Motor</text>
    <text x="118" y="-28" font-size="12" fill="#2563eb" font-weight="700">U</text>
    <text x="118" y="6" font-size="12" fill="#16a34a" font-weight="700">V</text>
    <text x="118" y="40" font-size="12" fill="#ca8a04" font-weight="700">W</text>
  </g>

  <!-- Controller -->
  <g class="label" transform="translate(720,280)">
    <rect width="420" height="400" rx="22" fill="#141414"/>
    <text x="210" y="36" text-anchor="middle" fill="#f4f5f7" font-size="16" font-weight="700">Controller</text>
    <!-- terminals -->
    <g font-size="13" font-weight="700" fill="#f4f5f7">
      <circle cx="0" cy="120" r="9" fill="#f0c14b" stroke="#c9a227" stroke-width="1.4"/>
      <text x="22" y="125">B+</text>
      <circle cx="0" cy="168" r="9" fill="#2563eb"/>
      <text x="22" y="173">U</text>
      <circle cx="0" cy="200" r="9" fill="#16a34a"/>
      <text x="22" y="205">V</text>
      <circle cx="0" cy="232" r="9" fill="#ca8a04"/>
      <text x="22" y="237">W</text>
      <circle cx="0" cy="280" r="9" fill="#f0c14b" stroke="#c9a227" stroke-width="1.4"/>
      <text x="22" y="285">B-</text>
    </g>
    <rect x="388" y="70" width="10" height="200" rx="3" fill="#f0c14b"/>
    <rect x="140" y="368" width="72" height="22" rx="4" fill="#0d0d0d"/>
    <rect x="230" y="368" width="72" height="22" rx="4" fill="#0d0d0d"/>
    <text x="176" y="384" text-anchor="middle" fill="#8d939c" font-size="10">Lock</text>
    <text x="266" y="384" text-anchor="middle" fill="#8d939c" font-size="10">Hall</text>
    <text x="210" y="348" text-anchor="middle" fill="#8d939c" font-size="11">Throttle / program</text>
  </g>

  <!-- Throttle -->
  <g class="label" transform="translate(1420,800)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="#141414"/>
    <rect x="118" y="-6" width="44" height="48" rx="16" fill="#0d0d0d"/>
    <text x="75" y="64" text-anchor="middle" font-size="13" font-weight="700" class="ink">Throttle</text>
  </g>

  <!-- Programming cable -->
  <g class="label" transform="translate(40,964)">
    <rect x="0" y="0" width="36" height="22" rx="4" fill="#2563eb"/>
    <rect x="36" y="7" width="70" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="106" y="4" width="22" height="14" rx="3" fill="#d1d5db" stroke="#9ca3af"/>
    <text x="160" y="17" font-size="13" font-weight="700" class="ink">Programming cable</text>
  </g>

  <!-- Hall caption -->
  <text class="label muted" x="490" y="840" font-size="12">Hall sensor</text>
  <text class="label muted" x="1080" y="840" font-size="12">Throttle</text>
  <text class="label muted" x="200" y="748" font-size="12">Lock</text>

  <!-- Legend -->
  <g class="label" transform="translate(1280,300)">
    <text x="0" y="0" font-size="16" font-weight="700" class="ink">Legend</text>
    <g font-size="13" class="ink">
      <line x1="0" y1="28" x2="36" y2="28" class="w-hv"/>
      <text x="48" y="32">72V positive (B+)</text>
      <line x1="0" y1="54" x2="36" y2="54" class="w-neg"/>
      <text x="48" y="58">72V negative (B-)</text>
      <line x1="0" y1="80" x2="36" y2="80" class="w-12"/>
      <text x="48" y="84">12V power</text>
      <line x1="0" y1="106" x2="12" y2="106" class="w-u"/>
      <line x1="12" y1="106" x2="24" y2="106" class="w-v"/>
      <line x1="24" y1="106" x2="36" y2="106" class="w-w"/>
      <text x="48" y="110">Motor phase U / V / W</text>
      <line x1="0" y1="132" x2="36" y2="132" class="w-ctl"/>
      <text x="48" y="136">Pre-charge / contactor control</text>
      <line x1="0" y1="158" x2="36" y2="158" class="w-ct"/>
      <text x="48" y="162">Current sense (CT -> meter)</text>
      <line x1="0" y1="184" x2="36" y2="184" class="w-hall"/>
      <text x="48" y="188">Hall sensor</text>
      <line x1="0" y1="210" x2="36" y2="210" class="w-thr"/>
      <text x="48" y="214">Throttle</text>
      <line x1="0" y1="236" x2="36" y2="236" class="w-prg"/>
      <text x="48" y="240">Programming</text>
    </g>
  </g>

  <!-- Title block -->
  <g class="label">
    <text x="900" y="1064" text-anchor="middle" font-size="22" font-weight="700" class="ink">Vespa EV Conversion - 72V Controller Wiring</text>
    <text x="900" y="1090" text-anchor="middle" font-size="13" class="muted">Redrawn from controller-wiring-reference. Educational build notes: verify ratings and pinouts before energizing.</text>
  </g>
</svg>
