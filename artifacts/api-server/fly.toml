# Fly.io config for Beckify API (api.beckify.com).
# Create the app once (Trevor): `fly apps create beckify-api`
# Then set secrets and deploy from this directory or via GitHub Actions.
#
# Docs: artifacts/api-server/README.md (Fly.io production path)

app = 'beckify-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
